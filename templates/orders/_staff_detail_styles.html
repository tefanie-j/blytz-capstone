.ue-body {
  width: 100%;
}

.ue-user {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(130px, 1fr) minmax(130px, 1fr);
  align-items: center;
  gap: 2rem;
  padding: 1.5rem 1.75rem;
  width: 100%;
}

.ue-user-info {
  display: flex;
  align-items: center;
  gap: 1rem;
  min-width: 0;
}

.ue-avatar {
  flex-shrink: 0;
}

.ue-user-details {
  min-width: 0;
}

.ue-user-email {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-primary);
  overflow-wrap: anywhere;
}

.ue-user-label {
  margin-top: 4px;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.ue-user-meta {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.55rem;
}

.ue-meta-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}

.ue-meta-value {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-primary);
}

.ue-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}

.ue-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.ue-status.is-active {
  color: #22c55e;
}

.ue-status.is-active .ue-status-dot {
  background: #22c55e;
}

.ue-status.is-inactive {
  color: #f87171;
}

.ue-status.is-inactive .ue-status-dot {
  background: #f87171;
}

/* Tablet */
@media (max-width: 768px) {
  .ue-user {
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .ue-user-info {
    grid-column: 1 / -1;
  }
}

/* Mobile */
@media (max-width: 480px) {
  .ue-user {
    grid-template-columns: 1fr;
    gap: 1.25rem;
    padding: 1.25rem;
  }

  .ue-user-info {
    grid-column: auto;
  }
}


/* ========================================
   CREATE STAFF PAGE
======================================== */

.cs-page {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* Breadcrumb */
.cs-breadcrumb {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin-bottom: 2rem;
}

.cs-breadcrumb a,
.cs-breadcrumb span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.cs-breadcrumb a {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  text-decoration: none;
  transition: color 0.2s;
