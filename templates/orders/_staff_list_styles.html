<style>
  /* Page header */
  .sp-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
  .sp-eyebrow{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
  .sp-h1{margin:.25rem 0 0;font-size:1.75rem;font-weight:700;color:#1a1a1a}
  .sp-sub{margin:.3rem 0 0;font-size:.9rem;color:#6b7280}

  /* Toolbar: chips + search */
  .sp-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
  .sp-chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .sp-chip{display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .8rem;border-radius:9999px;
    border:1px solid #e5e7eb;background:#fff;font-size:.78rem;font-weight:600;color:#4b5563;cursor:pointer;
    transition:border-color .15s,background .15s,color .15s}
  .sp-chip:hover{border-color:#D4AF37}
  .sp-chip.is-on{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
  .sp-chip .n{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;opacity:.75}
  .sp-dot{width:.5rem;height:.5rem;border-radius:9999px;background:#9ca3af}
  .sp-search{position:relative}
  .sp-search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:#9ca3af;pointer-events:none}
  .sp-search input{width:16rem;max-width:100%;min-height:2.4rem;padding:.4rem .8rem .4rem 2.2rem;border-radius:9999px;
    border:1px solid #e5e7eb;background:#fff;font-size:.82rem;color:#1a1a1a;transition:border-color .15s,box-shadow .15s}
  .sp-search input:focus{outline:none;border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.2)}

  /* Card + table */
  .sp-card{border:1px solid #e5e7eb;border-radius:1rem;background:#fff;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .sp-table{width:100%;border-collapse:collapse}
  .sp-table th{padding:.75rem 1rem;text-align:left;font-size:.68rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:#6b7280;background:#f9fafb;border-bottom:1px solid #e5e7eb;white-space:nowrap}
  .sp-table td{padding:.85rem 1rem;border-bottom:1px solid #f0f0f0;vertical-align:middle;font-size:.85rem;color:#1a1a1a}
  .sp-row[hidden]{display:none!important}
  .sp-row:last-child td{border-bottom:0}
  .sp-row td:first-child{box-shadow:inset 3px 0 0 transparent;transition:box-shadow .15s}
  .sp-row:hover td{background:#fffdf5}
  .sp-row:hover td:first-child{box-shadow:inset 3px 0 0 #D4AF37}
  .sp-person{display:flex;align-items:center;gap:.75rem;min-width:0}
  .sp-avatar{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;
    border-radius:9999px;background:#1a1a1a;color:#D4AF37;font-size:.8rem;font-weight:700}
  .sp-name{display:block;font-weight:600;color:#1a1a1a}
  .sp-name:hover{color:#8a6a00}
  .sp-muted{display:block;font-size:.74rem;color:#6b7280}
  .sp-mono{font-family:ui-monospace,Menlo,monospace}
  .sp-order{font-weight:700;color:#8a6a00}
  .sp-order:hover{text-decoration:underline}
  .sp-stack{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem}
  .sp-action{display:inline-flex;align-items:center;padding:.3rem .8rem;border-radius:.5rem;border:1px solid #D4AF37;
    background:transparent;color:#8a6a00;font-size:.75rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .15s}
  .sp-action:hover{background:rgba(212,175,55,.12)}

  /* Forms inside list pages */
  .sp-label{display:block;margin:0 0 .3rem;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7280}
  .sp-input{display:block;width:100%;min-height:2.4rem;padding:.4rem .7rem;border-radius:.6rem;border:1px solid #d1d5db;
    background:#fff;font-size:.88rem;color:#1a1a1a;transition:border-color .15s,box-shadow .15s}
  .sp-input:focus{outline:none;border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.2)}
  .sp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.4rem;padding:.4rem 1.2rem;border-radius:.6rem;
    border:1px solid #1a1a1a;background:#1a1a1a;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
  .sp-btn:hover{background:#D4AF37;border-color:#D4AF37;color:#000!important}

  /* Empty states */
  .sp-empty{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:2.5rem 1rem;text-align:center}
  .sp-empty[hidden]{display:none!important}
  .sp-empty-icon{display:inline-flex;align-items:center;justify-content:center;width:3rem;height:3rem;border-radius:9999px;
    background:#1a1a1a;color:#D4AF37;font-size:1.2rem}
  .sp-empty strong{font-size:.95rem;color:#1a1a1a}
  .sp-empty span{font-size:.82rem;color:#6b7280}

  /* Phones: rows become cards */
  @media (max-width:767px){
    .sp-table thead{display:none}
    .sp-table,.sp-table tbody{display:block}
    .sp-row{display:block;padding:.9rem 1rem;border-bottom:1px solid #f0f0f0}
    .sp-row:last-child{border-bottom:0}
    .sp-table td{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.4rem 0;border:0}
    .sp-table td::before{content:attr(data-label);flex:0 0 5.5rem;font-size:.66rem;font-weight:700;
      letter-spacing:.08em;text-transform:uppercase;color:#9ca3af}
    .sp-table td.sp-first{display:block;padding-bottom:.6rem}
    .sp-table td.sp-first::before{content:none}
    .sp-row td:first-child{box-shadow:none}
    .sp-search,.sp-search input{width:100%}
  }
</style>
